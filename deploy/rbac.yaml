---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frpva
  namespace: frpva-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: frpva
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods/resize"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["frpva.wrouesnel.github.com"]
    resources: ["proportionalresourcepolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["frpva.wrouesnel.github.com"]
    resources: ["proportionalresourcepolicies/status"]
    verbs: ["get", "patch", "update"]
  # The self-managed certificate rotator injects its CA into the webhook configuration.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    resourceNames: ["frpva"]
    verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: frpva
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: frpva
subjects:
  - kind: ServiceAccount
    name: frpva
    namespace: frpva-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frpva
  namespace: frpva-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["frpva-webhook-cert"]
    verbs: ["update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frpva
  namespace: frpva-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: frpva
subjects:
  - kind: ServiceAccount
    name: frpva
    namespace: frpva-system
